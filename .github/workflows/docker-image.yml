name: Deploy to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          echo "Running on Ubuntu EC2"
          hostname
          whoami

      - name: Check Docker
        run: docker --version

      - name: Deploy Application
        run: |
          docker compose up -d --build

      - name: Verify Containers
        run: docker compose ps
